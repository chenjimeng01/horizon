<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Free Light Illustration | Chenji Meng</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@600&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: 'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        background: #f3f5f7;
      }
      button, input, select { font-family: inherit; }
      ::selection { background: #d5e4f7; }
      :focus-visible { outline: 2px solid #2a78d6; outline-offset: 2px; }
      table { border-collapse: collapse; }
      /* Form controls for the on-page questionnaire (self-contained; no external refs). */
      input[type=text], input[type=number], input[type=email], select, textarea {
        width: 100%; padding: 7px 10px; border: 1px solid #cbd5e1; border-radius: 7px;
        font: inherit; font-size: 13px; color: #131f30; background: #fff;
      }
      textarea { min-height: 70px; resize: vertical; }
      input:focus, select:focus, textarea:focus { outline: 2px solid #2a78d6; outline-offset: 0; border-color: #2a78d6; }
      /* Responsive utilities for the React funnel (grid-template + overflow only;
         the components keep their other styles inline). Grids collapse to a single
         column on phones; wide tables scroll inside their own wrapper. */
      .pgrid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .pgrid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
      .tscroll { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .tscroll > table.rowmin { min-width: 520px; }
      .wrapx { flex-wrap: wrap; }
      @media (max-width: 620px) {
        .pgrid2, .pgrid3 { grid-template-columns: 1fr; }
      }
    </style>
