tween spouses. Per-client tax country: Scottish non-savings rates and 2026/27 bands where selected; savings and dividends stay on UK-wide bands. UK tax basis 2026/27 with enacted Autumn 2025 Budget changes applied from their start years: dividend rates 10.75/35.75/39.35; savings and rUK property income at 22/42/47 from 2027/28; only the first £2,000 of salary-sacrificed pension contributions NI-exempt from 2029/30; thresholds frozen to 2030/31 by default then indexed. Full banded income tax with PA taper, PSA and dividend allowance; employee NI to state pension age; CGT on GIA and non-PPR property disposals with annual exempt amount and 18/24% banding; ISA and pension grow tax free in the UK; pension access from 57 with 25% of each withdrawal tax free (UFPLS treatment; cumulative tax-free elements above the £268,275 lump sum allowance are flagged, not taxed); state pension approximates the triple lock. Bond chargeable gains are stacked as non-savings income and the PSA tier ignores dividends (both slight simplifications). Bonds roll up gross (onshore net of a 20% life-fund drag on growth) with a cumulative 5% of premiums tax-deferred withdrawal allowance; the excess is a chargeable event gain taxed as income, onshore with a 20% credit (top-slicing relief not modelled). Family investment companies use a two-layer treatment: received equity dividends exempt in the company, interest and rental at 25% corporation tax, extraction realises company gains at corporation tax pro rata; personally, director's loan repayments are tax free and the balance is taxed as dividends. On a UK departure the s185 corporate exit charge is warned about, or applied when company control is set to migrate. NS&I certificate interest is tax free while UK resident; NS&I and ISA income are taxed at the destination's investment rate during abroad years. Liabilities are interest-only or amortising repayment loans with optional drawdown and repayment years; balances reduce net worth. Planned disposals sell assets (or a fraction of them) by wrapper rules; property is otherwise illiquid. Life events scale or pause salaries with one line. Pension contributions above the standard annual allowance are flagged, not charged (taper and carry-forward not modelled). Withdrawal policy is selectable: preserve pensions (drawn last), band-managed UFPLS draws to the top of a chosen tax band with surpluses swept to ISA/GIA, or pensions-first depletion; annuity purchases convert pension into lifetime income (level or CPI-linked, optional 25% tax-free cash). Otherwise shortfalls draw cash and NS&I first and surpluses fill the cash floor, then each person's ISA allowance (UK years only), then GIA. Abroad years apply flat headline rates by jurisdiction; UK rental stays UK-taxed. The five-year rule tracks GIA and property gains, bond chargeable gains and close-company (FIC) dividends while non-resident and charges UK tax (less foreign credit) in the year of return when the absence is five complete tax years or less. Each client's plan age is their modelled death age: the plan runs to the second death, the first death passes everything to the survivor (spouse exemption), the deceased's incomes, state pension and annuities stop, and household spending scales by the survivor-spending assumption. IHT is computed each year on a second-death basis (transferable nil-rate bands, residence band with taper when a main home exists, pensions in the estate from April 2027); the terminal figure is the modelled bill on death. Lifetime gifts leave the plan as cash, use the 3,000 annual exemptions, and join the IHT figures as potentially exempt transfers with seven-year clocks, nil-rate band consumption in gift order and taper relief; sustained regular gifts are flagged as candidates for the normal-expenditure exemption (not assumed). A charitable legacy share reduces the estate and applies the 36% rate when it reaches 10% of the baseline. Monte Carlo uses lognormal returns (median run equals the central projection), two correlated equity/defensive factors and fat-tailed Student-t shocks, seeded for reproducibility; a spending-flex rule can cut discretionary expenses after bad years to price real-world flexibility. Gilt ladders hold each rung to maturity: coupons are taxed as savings income, redemptions are CGT free (gilts are exempt), and rungs are contractual so simulations never shock them; index-linked rungs are entered in today's money and uplift with inflation, following the replayed CPI path in backtests. The security floor asks whether baseline (non-discretionary) spending could be met from secure sources alone (state pension, annuity and DB income, cash, NS&I, gilt ladders) and reports the funded horizon in years; gifts and one-off purchases are excluded from baseline, and floor income is taxed as if it were the only income. Assets and salaries can carry a concentration group: the share of the extended balance sheet (asset values plus the present value of future earnings) in each group is measured, warned on above 40%, and stress-testable as a single correlated shock. Winding up a family investment company by members' voluntary liquidation distributes company value (less corporation tax on embedded gains) as capital rather than dividends, with optional Business Asset Disposal Relief at 18% from April 2026 within the £1m lifetime limit; MVL qualifying conditions are warned about, not modelled. Optional annual policies: bed-and-ISA moves GIA into each person's unused ISA allowance (realising gains on the way), and CGT harvesting realises gains inside the annual exemption to uplift GIA cost basis. Funded-ratio spending guardrails compare each simulated year with the central plan and cut (or, where opted in, raise) discretionary spending outside the bands, re-tested annually. The historical backtest replays the plan through every rolling window of a sourced UK dataset (1871-2025), with equities and gilts on actual total returns and CPI replayed through
