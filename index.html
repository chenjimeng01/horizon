savings income and the PSA tier ignores dividends (both slight simplifications). Bonds roll up gross (onshore net of a 20% life-fund drag on growth) with a cumulative 5% of premiums tax-deferred withdrawal allowance; the excess is a chargeable event gain taxed as income, onshore with a 20% credit (top-slicing relief not modelled). Family investment companies use a two-layer treatment: received equity dividends exempt in the company, interest and rental at 25% corporation tax, extraction realises company gains at corporation tax pro rata; personally, director's loan repayments are tax free and the balance is taxed as dividends. On a UK departure the s185 corporate exit charge is warned about, or applied when company control is set to migrate. NS&I certificate interest is tax free while UK resident; NS&I and ISA income are taxed at the destination's investment rate during abroad years. Liabilities are interest-only or amortising repayment loans with optional drawdown and repayment years; balances reduce net worth. Planned disposals sell assets (or a fraction of them) by wrapper rules; property is otherwise illiquid. Life events scale or pause salaries with one line. Pension contributions above the standard annual allowance are flagged, not charged (taper and carry-forward not modelled). Withdrawal policy is selectable: preserve pensions (drawn last), band-managed UFPLS draws to the top of a chosen tax band with surpluses swept to ISA/GIA, or pensions-first depletion; annuity purchases convert pension into lifetime income (level or CPI-linked, optional 25% tax-free cash). Otherwise shortfalls draw cash and NS&I first and surpluses fill the cash floor, then each person's ISA allowance (UK years only), then GIA. Abroad years apply flat headline rates by jurisdiction; UK rental stays UK-taxed. The five-year rule tracks GIA and property gains, bond chargeable gains and close-company (FIC) dividends while non-resident and charges UK tax (less foreign credit) in the year of ains on the way), and CGT harvesting realises gains inside the annual exemption to uplift GIA cost basis. Funded-ratio spending guardrails compare each simulated year with the central plan and cut (or, where opted in, raise) discretionary spending outside the bands, re-tested annually. The historical backtest replays the plan through every rolling window of a sourced UK dataset (1871-2025), with equities and gilts on actual total returns and CPI replayed through indexation and the triple lock; property and cash keep their assumed returns and tax band indexation is not replayed. Not modelled: DB transfer values, trusts and CLTs, gifts with reservation, corporate exit charges other than s185, departure exit taxes, FX. Illustrative only, not financial or tax advice.",x.jsxs("div",{style:{marginTop:8,paddingTop:8,borderTop:`1px solid ${E.divider}`},children:["© ",new Date().getFullYear()," Chenji Meng. All rights reserved · Proprietary model · Horizon v",tie,"· UK rates basis 2026/27"]})]})}function iie(){var u;const[e,t]=U.useState(()=>Ql(FM()??Pk())),n=f=>t(Ql(f)),[r,i]=U.useState("forecast"),[a,o]=U.useState(null);U.useEffect(()=>{const f=setTimeout(()=>UM(e),400);return()=>clearTimeout(f)},[e]);const s=U.useMemo(()=>{try{return{ok:!0,...Jr(e)}}catch(f){return{ok:!1,error:f.message}}},[e]),l=[["forecast","Forecast"],["montecarlo","Monte Carlo"],["backtest","Backtest"],["compare","Residency comparison"],["scenarios","Scenario comparison"],["table","Year table"]];return x.jsx("div",{style:{minHeight:"100vh",background:E.bg,color:E.text,fontFamily:E.fontUI,fontSize:14},children:x.jsxs("div",{style:{maxWidth:1320,margin:"0 auto",padding:"32px 24px"},children:[x.jsx(nie,{}),x.jsx(XM,{scenario:e,setScenario:n}),x.jsxs("div",{style:{display:"grid",gridTemplateColumns:"minmax(340px, 5fr) 8fr",gap:18,alignItems:"start"},children:[x.jsxs("div",{children:[x.jsx(yre,{scenario:e,update:n}),x.jsx(mre,{scenario:e,update:n}),x.jsx(gre,{scenario:e,update:n}),x.jsx(Br,{title:"Assets",
